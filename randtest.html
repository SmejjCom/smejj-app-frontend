<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Randtest App-Nachbau</title>
<style>
 html{background:#000}
 body{margin:0;color:#f2f5f4;font:600 15px/1.4 -apple-system,sans-serif;min-height:100dvh}
 /* Grund wie in der App, mit Ueberstand */
 body::before{content:"";position:fixed;top:-120px;right:-120px;bottom:-120px;left:-120px;z-index:-1;
  background:radial-gradient(820px 520px at 18% -12%,rgba(50,246,234,.13),transparent 62%),
             radial-gradient(700px 480px at 88% 108%,rgba(13,148,210,.10),transparent 64%),
             linear-gradient(180deg,#0b1016 0%,#070a0e 55%,#000 100%) #000}
 /* Rahmen OHNE unteren Strich: box-shadow nur oben/links/rechts */
 body::after{content:"";position:fixed;inset:0;z-index:80;pointer-events:none;
  box-shadow:inset 0 1px 0 rgba(2,253,253,.3), inset 1px 0 0 rgba(2,253,253,.3), inset -1px 0 0 rgba(2,253,253,.3),
             inset 0 0 26px rgba(2,253,253,.22), inset 0 0 72px rgba(50,246,234,.13)}
 .dock{position:fixed;left:12px;right:12px;bottom:0;height:96px;border-radius:18px 18px 0 0;
  background:rgba(255,255,255,.05);-webkit-backdrop-filter:blur(34px) saturate(170%);backdrop-filter:blur(34px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12);display:flex;align-items:center;padding:0 16px;color:rgba(242,245,244,.55)}
 #w{position:fixed;top:70px;left:10px;right:10px;background:rgba(0,0,0,.8);padding:8px;font-size:14px;z-index:95}
 #w b{color:#02fdfd}
 h1{position:fixed;top:150px;left:16px;font-size:26px;margin:0}
</style></head><body>
<h1>Womit kann ich dir helfen?</h1>
<div id="w">…</div>
<div class="dock">Frag mich alles</div>
<script>
var d=document.createElement("div");d.style.cssText="position:fixed;inset:0;visibility:hidden";document.body.appendChild(d);
var r=d.getBoundingClientRect();d.remove();
function sa(n){var p=document.createElement("div");p.style.cssText="position:fixed;visibility:hidden;height:env("+n+",0px)";document.body.appendChild(p);var h=Math.round(p.getBoundingClientRect().height);p.remove();return h;}
document.getElementById("w").innerHTML="<b>Schirm</b> "+screen.height+" <b>Fenster</b> "+innerHeight+" <b>fixed</b> top "+Math.round(r.top)+" hoch "+Math.round(r.height)+" <b>SA</b> "+sa("safe-area-inset-top")+"/"+sa("safe-area-inset-bottom");
</script></body></html>
