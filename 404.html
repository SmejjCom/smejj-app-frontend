<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icons/smejj_icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/icons/favicon-16x16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <script>
    // SPA-Fallback fuer GitHub Pages: App-Routen (ohne Dateiendung) zur Shell umleiten.
    (function () {
      var path = location.pathname;
      if (path.replace(/\/$/, "") === "/home") {
        location.replace("/");
        return;
      }
      if (/^\/[a-z0-9-]+(\/[a-z0-9-]+)*\/?$/i.test(path) && path.indexOf(".") === -1) {
        sessionStorage.setItem("smejj-restore-route", path + location.search + location.hash);
        location.replace("/");
      }
    })();
  </script>
  <title>404 — Seite nicht gefunden | smejj.com</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b0d10; color: #e8eaed; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    main { text-align: center; padding: 2rem; }
    .error-brand { display: inline-flex; width: 42px; margin-bottom: 2rem; padding: 0; background: transparent; }
    .error-brand img { display: block; width: 100%; height: auto; aspect-ratio: 2000 / 1532.335; object-fit: contain; background: transparent; }
    h1 { font-size: 3rem; margin: 0 0 0.5rem; }
    p { color: #9aa0a6; margin: 0 0 1.5rem; }
    a { color: #8ab4f8; text-decoration: none; border: 1px solid #3c4043; border-radius: 999px; padding: 0.6rem 1.4rem; display: inline-block; }
  </style>
</head>
<body>
  <main>
    <a class="error-brand" href="/" aria-label="smejj.com Startseite">
      <img src="/icons/smejj_icon.svg" alt="smejj" width="2000" height="1532">
    </a>
    <h1>404</h1>
    <p>Diese Seite gibt es auf smejj.com nicht.</p>
    <a href="/">Zur Startseite</a>
  </main>
</body>
</html>
