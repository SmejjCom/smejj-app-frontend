<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101113">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="smejj Mass">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.webmanifest">
    <title>smejj.com — Bildschirm ausmessen</title>
    <!-- Diagnoseseite. Sie beantwortet EINE Frage: reicht die Seite bis in die
         unterste Kante des iPhones, oder bleibt darunter ein Streifen? Dafuer
         zeigt sie die Zahlen gross an und faerbt die untere Safe-Area PINK.
         Sieht man Pink bis zum unteren Rand, deckt die Seite den ganzen Schirm.
         Bleibt darunter Schwarz, kommt die Seite dort gar nicht hin — dann ist
         viewport-fit=cover nicht aktiv (bei installierten Apps friert iOS den
         Zustand vom Tag des Hinzufuegens ein). -->
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; padding: 0; background: #050608; color: #e8f4f2; }
      body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      /* Fester Grund ueber den GANZEN Schirm — dieselbe Technik wie in der App. */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -2;
        background: linear-gradient(180deg, #0b1016 0%, #050608 100%) #050608;
      }
      /* Die untere Safe-Area sichtbar machen. Reicht Pink bis zur Schirmkante,
         ist alles richtig; bleibt darunter Schwarz, endet die Seite zu frueh. */
      .kante {
        position: fixed;
        left: 0; right: 0; bottom: 0;
        height: calc(env(safe-area-inset-bottom, 0px) + 6px);
        background: #ff3ea5;
        z-index: 10;
      }
      main { padding: calc(env(safe-area-inset-top, 0px) + 20px) 20px calc(env(safe-area-inset-bottom, 0px) + 40px); }
      h1 { font-size: 22px; margin: 0 0 18px; }
      table { width: 100%; border-collapse: collapse; font-size: 19px; }
      th, td { text-align: left; padding: 9px 0; border-bottom: 1px solid #1c2630; }
      th { color: #7f95a3; font-weight: 500; }
      td { font-variant-numeric: tabular-nums; font-weight: 700; }
      .gut { color: #35e0a1; }
      .schlecht { color: #ff6b6b; }
      .urteil { margin: 20px 0 0; padding: 16px; border: 1px solid #1c2630; font-size: 18px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Bildschirm ausmessen</h1>
      <table>
        <tr><th>Als App gestartet</th><td id="standalone">—</td></tr>
        <tr><th>Bildschirm hoch</th><td id="screen">—</td></tr>
        <tr><th>Seite hoch</th><td id="inner">—</td></tr>
        <tr><th>Unten frei (safe-area)</th><td id="sab">—</td></tr>
        <tr><th>Oben frei (safe-area)</th><td id="sat">—</td></tr>
        <tr><th>Fehlende Höhe</th><td id="diff">—</td></tr>
      </table>
      <p class="urteil" id="urteil">wird gemessen …</p>
      <p style="color:#7f95a3;font-size:15px">Der pinke Streifen ganz unten muss bis zur untersten Kante des Bildschirms reichen. Bleibt darunter Schwarz, kommt die Seite dort nicht hin.</p>
    </main>
    <div class="kante"></div>
    <script>
      function px(name) {
        const p = document.createElement("div");
        p.style.cssText = "position:fixed;visibility:hidden;height:env(" + name + ",0px)";
        document.body.append(p);
        const wert = Math.round(parseFloat(getComputedStyle(p).height) || 0);
        p.remove();
        return wert;
      }
      function messen() {
        const standalone = window.navigator.standalone === true
          || window.matchMedia("(display-mode: standalone)").matches;
        const sab = px("safe-area-inset-bottom");
        const sat = px("safe-area-inset-top");
        // screen.height ist die volle Geraetehoehe in Punkten; innerHeight die
        // Hoehe, die die Seite bekommt. Bei viewport-fit=cover sind sie im
        // Vollbild gleich. Klafft eine Luecke, endet die Seite zu frueh.
        const fehlt = Math.round(screen.height - window.innerHeight);
        document.getElementById("standalone").textContent = standalone ? "ja" : "nein (im Browser)";
        document.getElementById("standalone").className = standalone ? "gut" : "schlecht";
        document.getElementById("screen").textContent = screen.height + " pt";
        document.getElementById("inner").textContent = window.innerHeight + " pt";
        document.getElementById("sab").textContent = sab + " pt";
        document.getElementById("sat").textContent = sat + " pt";
        const d = document.getElementById("diff");
        d.textContent = fehlt + " pt";
        d.className = fehlt <= 2 ? "gut" : "schlecht";
        const u = document.getElementById("urteil");
        if (!standalone) {
          u.textContent = "Im Browser gestartet. Für den echten Test: Teilen → Zum Home-Bildschirm, dann diese Seite von dort öffnen.";
        } else if (fehlt <= 2 && sab > 0) {
          u.innerHTML = "<span class='gut'>Alles richtig.</span> Die Seite reicht bis in die unterste Kante, die Safe-Area wird gemeldet.";
        } else if (sab === 0) {
          u.innerHTML = "<span class='schlecht'>viewport-fit=cover ist nicht aktiv.</span> Die Seite bekommt keine Safe-Area gemeldet. Bei installierten Apps hilft: App löschen und neu zum Home-Bildschirm hinzufügen.";
        } else {
          u.innerHTML = "<span class='schlecht'>Es fehlen " + fehlt + " Punkte.</span> Die Seite endet vor der unteren Kante.";
        }
      }
      messen();
      window.addEventListener("resize", messen);
      window.addEventListener("orientationchange", () => setTimeout(messen, 300));
    </script>
  </body>
</html>
