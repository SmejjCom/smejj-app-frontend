<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; connect-src 'self' blob: data: https://api.smejj.com https://smejj-control.zeabur.app https://smejj-chat-bridge.zeabur.app https://api.openai.com https://api.moonshot.ai https://api.mistral.ai http://localhost:* http://127.0.0.1:*">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="robots" content="noindex,nofollow">
    <title>smejj.com — Maus-Replay</title>
    <!-- Additive Route (Stufe A, 2026-07-15): sichtbare Wiedergabe eines
         Maus-Engine-Laufs. Bewusst OHNE eigene Favicon-Links (Favicon-Lock);
         der Browser nutzt automatisch /favicon.ico. Startseite unberuehrt. -->
    <link rel="stylesheet" href="/assets/maus-replay.css?v=maus-replay-20260715-3">
  </head>
  <body class="maus-replay-body">
    <main class="replay-shell">
      <header class="replay-header">
        <a class="brand" href="/">smejj.com</a>
        <h1>Maus-Replay</h1>
        <span class="hint">Sichtbare Wiedergabe eines Maus-Engine-Laufs — 100% client-seitig, Anmeldung erforderlich.</span>
      </header>

      <form id="replayForm" class="replay-form" autocomplete="off">
        <label>capsuleRef
          <input id="replayCapsuleRef" name="capsuleRef" placeholder="z. B. maus-demo-sprachwelle-2026-07-15-r5">
        </label>
        <label>planId
          <input id="replayPlanId" name="planId" placeholder="z. B. httpbin-form-post-demo">
        </label>
        <label>runId (optional)
          <input id="replayRunId" name="runId" placeholder="alternativ: runId eines Async-Laufs">
        </label>
        <button id="replayLoadButton" class="primary" type="submit">Lauf laden</button>
        <button id="replayLiveButton" type="button" title="Laufenden Lauf live mitverfolgen">● Live mitschauen</button>
      </form>

      <p id="replayMessage" class="replay-message" aria-live="polite"></p>

      <section id="replayStageWrap" class="replay-stage-wrap" aria-label="Wiedergabe">
        <div class="replay-status">
          <span id="replayStepCounter" class="step-counter">Schritt 0/0</span>
          <span id="replayStepLabel" class="step-label"></span>
          <span id="replayTypedText" class="typed-text" aria-live="polite"></span>
        </div>

        <div id="replayStage" class="replay-stage">
          <img id="replayShot" class="stage-shot" alt="Screenshot des Laufs" style="display:none">
          <div id="replayStageEmpty" class="stage-empty">Noch kein Screenshot für diesen Schritt — der Cursor zeigt die Aktion trotzdem.</div>
          <div id="replayCursorPulse" class="maus-cursor-pulse" aria-hidden="true"></div>
          <img id="replayCursor" class="maus-cursor is-hidden" alt="" aria-hidden="true">
        </div>

        <div class="replay-controls">
          <button id="replayPlayButton" class="primary" type="button">Abspielen</button>
          <button id="replayPrevButton" type="button" aria-label="Schritt zurück">◀ Schritt</button>
          <button id="replayNextButton" type="button" aria-label="Schritt vor">Schritt ▶</button>
          <label class="hint">Tempo
            <select id="replaySpeed">
              <option value="0.5">0.5×</option>
              <option value="1" selected>1×</option>
              <option value="2">2×</option>
            </select>
          </label>
          <span class="spacer"></span>
        </div>

        <div id="replayStepList" class="replay-steps" aria-label="Schrittliste"></div>
      </section>
    </main>
    <script type="module" src="/assets/maus-replay.js?v=maus-replay-20260715-3"></script>
  </body>
</html>
